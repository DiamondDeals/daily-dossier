<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting to Latest Database...</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: #1d1d1f; color: #f5f5f7; display: flex; align-items: center;
               justify-content: center; height: 100vh; margin: 0; }
        a { color: #0a84ff; }
    </style>
    <script>
        // Find most recent all_items page by checking dates backwards from today
        (function() {
            var today = new Date();
            for (var i = 0; i < 60; i++) {
                var d = new Date(today);
                d.setDate(d.getDate() - i);
                var ds = d.toISOString().slice(0, 10);
                var url = 'all_items_' + ds + '.html';
                var xhr = new XMLHttpRequest();
                xhr.open('HEAD', url, false);
                try {
                    xhr.send();
                    if (xhr.status === 200) {
                        window.location.replace(url);
                        return;
                    }
                } catch(e) {}
            }
        })();
    </script>
</head>
<body>
    <p>Redirecting to latest database... <a href="all_items_2026-03-23.html">Click here if not redirected</a></p>
</body>
</html>
